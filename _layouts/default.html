<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{{ page.title | default: site.title }}</title>

  <meta
    name="description"
    content="{{ page.description | default: site.description }}"
  >

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- Main stylesheet -->
  <link
    rel="stylesheet"
    href="{{ '/assets/css/style.css' | relative_url }}"
  >

</head>

<body>

  {% include header.html %}

  <main id="app">
    {{ content }}
  </main>

  {% include footer.html %}


  <!-- Navigation + Footer JavaScript -->
  <script>
  (function(){
    "use strict";

    /* =========================
       MOBILE NAVIGATION
       ========================= */

    var navLinks = document.getElementById("navLinks");
    var navToggle = document.getElementById("navToggle");

    if (navToggle && navLinks) {
      navToggle.addEventListener("click", function(){

        var isOpen = navLinks.classList.toggle("open");

        navToggle.classList.toggle("open", isOpen);

        navToggle.setAttribute(
          "aria-expanded",
          isOpen ? "true" : "false"
        );

      });
    }


    /* =========================
       FOOTER YEAR
       ========================= */

    var yearEl = document.getElementById("year");

    if (yearEl) {
      yearEl.textContent = new Date().getFullYear();
    }

  })();
  </script>

<script src="{{ '/assets/js/youtube-lightbox.js' | relative_url }}"></script>
</body>
</html>
