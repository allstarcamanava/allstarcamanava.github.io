  ### PAMANA: The All Star Annual 2026-2027 is the inaugural annual collection
  of the Rotary E-Club of All Star CAMANAVA, capturing the people, stories,
  service, fellowship, and moments that shaped the Rotary year.


  ##### Inspired by the Filipino spirit of heritage and continuity, PAMANA brings together a year of memories and milestones, celebrating what was shared, created, and passed forward.
