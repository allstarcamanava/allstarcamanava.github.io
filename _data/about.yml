eyebrow: About the Club
title: |-
  Rotary E-Club of 
  All Star CAMANAVA
intro: We are a non-governmental service organization operating primarily
  online, uniting Rotarians across Caloocan, Malabon, Navotas and Valenzuela.
  Our e-club format means fellowship and service happen wherever our members are
  — through digital meetings, shared projects and an active online community.
quote: '*"Service above self — delivered wherever our members log in."*'
