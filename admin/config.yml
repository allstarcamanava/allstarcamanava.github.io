backend:
  name: github
  repo: allstarcamanava/allstarcamanava.github.io
  branch: main
  use_graphql: true
  base_url: https://allstarcamanava-decap-oauth.jemuel-a-pilapil.workers.dev
  auth_endpoint: /auth

publish_mode: editorial_workflow
show_preview_links: true
display_url: https://allstarcamanava.netlify.app
logo_url: https://allstarcamanava.netlify.app/uploads/logo.jpg

media_folder: "uploads"
public_folder: "../uploads"

collections:
  - name: "posts"
    label: "Bulletins"
    label_singular: "Bulletin"
    folder: "_posts/"
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    editor:
      preview: false

    fields:
      - label: "Layout"
        name: "layout"
        widget: "hidden"
        default: "bulletin"

      - label: "Title"
        name: "title"
        widget: "string"

      - label: "Publish Date"
        name: "date"
        widget: "datetime"
        required: false
        date_format: "YYYY-MM-DD"
        time_format: false

      - label: "Category"
        name: "categories"
        widget: "select"
        options:
          - "Service Projects"
          - "Announcement"
          - "Event"
          - "Club Bulletin"
        default: "Service Projects"

      - label: "Permalink"
        name: "permalink"
        widget: "string"
        required: false
        hint: "Optional. Leave blank to use the default post URL."

      - label: "Featured Image"
        name: "image"
        widget: "image"
        required: false
        media_folder: "/assets/images/bulletins"
        public_folder: "/assets/images/bulletins"

      - label: "Image Alt Text"
        name: "image_alt"
        widget: "string"
        required: false

      - label: "Body"
        name: "body"
        widget: "markdown"

  - name: "site"
    label: "Site Settings"
    description: "Manage the homepage hero section."
    files:
      - name: "hero"
        label: "Hero Section"
        file: "_data/site.yml"
        fields:

          - label: "Hero Image"
            name: "hero_image"
            widget: "image"
            required: false

          - label: "Eyebrow"
            name: "hero_eyebrow"
            widget: "string"
            required: false

          - label: "Heading - First Line"
            name: "hero_title_line1"
            widget: "string"
            required: false

          - label: "Heading - Emphasis"
            name: "hero_title_emphasis"
            widget: "string"
            required: false
            hint: "This text appears in italic/emphasis styling."

          - label: "Heading - Second Line"
            name: "hero_title_line2"
            widget: "string"
            required: false

          - label: "Description"
            name: "hero_description"
            widget: "text"
            required: false

          - label: "Primary Button Text"
            name: "hero_primary_text"
            widget: "string"
            required: false

          - label: "Primary Button Link"
            name: "hero_primary_link"
            widget: "string"
            required: false

          - label: "Secondary Button Text"
            name: "hero_secondary_text"
            widget: "string"
            required: false

          - label: "Secondary Button Link"
            name: "hero_secondary_link"
            widget: "string"
            required: false
            
          - label: "Green Gradient Overlay"
            name: "hero_overlay"
            widget: "boolean"
            default: true
            required: false
            hint: "Adds the green/turquoise gradient overlay over the hero image. Turn off to display the hero image without the color overlay."
            
          - label: "Rotating Decorative Shape"
            name: "hero_decoration"
            widget: "boolean"
            default: true
            required: false
            hint: "Displays the subtle rotating geometric decoration on the right side of the hero section. Turn off to hide the decoration."
