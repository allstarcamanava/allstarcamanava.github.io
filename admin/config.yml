backend:
  name: github
  repo: allstarcamanava/allstarcamanava.github.io
  branch: main
  use_graphql: true
  base_url: https://allstarcamanava-decap-oauth.jemuel-a-pilapil.workers.dev
  auth_endpoint: /auth

publish_mode: editorial_workflow
show_preview_links: true
display_url: https://www.allstarcamanava.org
logo_url: https://allstarcamanava.netlify.app/uploads/logo.jpg

media_library:
  name: cloudinary
  config:
    cloud_name: pccjbjtq
    api_key: 643196993737111

media_folder: "assets/images/bulletins"
public_folder: "/assets/images/bulletins"

collections:
  - name: "posts"
    label: "Posts"
    label_singular: "Post"
    folder: "_posts/"
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"

    fields:
      - label: "Layout"
        name: "layout"
        widget: "select"
        default: "bulletin"
        options:
          - label: "Standard Bulletin"
            value: "bulletin"
          - label: "Full-Width Bulletin"
            value: "bulletin-full"

      - label: "Title"
        name: "title"
        widget: "string"

      - label: "Publish Date"
        name: "date"
        widget: "datetime"
        required: false
        date_format: "YYYY-MM-DD"
        time_format: false

      - label: "Category"
        name: "categories"
        widget: "select"
        options:
          - label: "Service Projects"
            value: "service-projects"
          - label: "Announcement"
            value: "Announcement"
          - label: "Event"
            value: "Event"
          - label: "Club Bulletin"
            value: "club-bulletin"
          - label: "Other"
            value: "Other"
        default: "club-bulletin"

      - label: "Show in Club Bulletins?"
        name: "show_in_bulletins"
        widget: "boolean"
        default: true
        required: false
        hint: "When enabled, this post will also appear in the Club Bulletins and Service Projects page simultaneously."              

      - label: "Permalink"
        name: "permalink"
        widget: "string"
        required: false
        hint: "Optional. Leave blank to use the default post URL."

      - label: "Enable Comments"
        name: "comments"
        widget: "boolean"
        default: true
        required: false
        hint: "Enable Disqus comments for this post."

      - label: "Featured Image"
        name: "image"
        widget: "image"
        required: false

      - label: "Thumbnail"
        name: "thumbnail"
        widget: "image"
        required: false
        hint: "Optional. This image is used as the thumbnail in the Recent Posts & Bulletins card."        

      - label: "Post Image"
        name: "post_image"
        widget: "image"
        required: false
        hint: "Optional. This image appears only inside the individual bulletin page."

      - label: "Image Alt Text"
        name: "image_alt"
        widget: "string"
        required: false

      - label: "Gallery"
        name: "gallery"
        widget: "list"
        required: false
        allow_add: true
        allow_remove: true
        field:
          label: "Image"
          name: "image"
          widget: "image"
          required: false
          media_folder: "/assets/images/bulletins"
          public_folder: "/assets/images/bulletins"

      - label: "Custom Embed Code"
        name: "custom_embed"
        widget: "code"
        required: false
        default_language: "html"
        allow_language_selection: false
        output_code_only: true
        hint: "Optional. Paste the embed code here."

      - label: "Body"
        name: "body"
        widget: "markdown"        

  - name: "site"
    label: "Site Settings"
    description: "Manage homepage content and other site settings."
    files:
      - name: "hero"
        label: "Hero Section"
        file: "_data/site.yml"
        fields:

          - label: "Hero Image"
            name: "hero_image"
            widget: "image"
            required: false

          - label: "Eyebrow"
            name: "hero_eyebrow"
            widget: "string"
            required: false

          - label: "Heading - First Line"
            name: "hero_title_line1"
            widget: "string"
            required: false

          - label: "Heading - Emphasis"
            name: "hero_title_emphasis"
            widget: "string"
            required: false
            hint: "This text appears in italic/emphasis styling."

          - label: "Heading - Second Line"
            name: "hero_title_line2"
            widget: "string"
            required: false

          - label: "Description"
            name: "hero_description"
            widget: "text"
            required: false

          - label: "Primary Button Text"
            name: "hero_primary_text"
            widget: "string"
            required: false

          - label: "Primary Button Link"
            name: "hero_primary_link"
            widget: "string"
            required: false

          - label: "Secondary Button Text"
            name: "hero_secondary_text"
            widget: "string"
            required: false

          - label: "Secondary Button Link"
            name: "hero_secondary_link"
            widget: "string"
            required: false

          - label: "Green Gradient Overlay"
            name: "hero_overlay"
            widget: "boolean"
            default: true
            required: false
            hint: "Adds the green/turquoise gradient overlay over the hero image. Turn off to display the hero image without the color overlay."

          - label: "Rotating Decorative Shape"
            name: "hero_decoration"
            widget: "boolean"
            default: true
            required: false
            hint: "Displays the subtle rotating geometric decoration on the right side of the hero section. Turn off to hide the decoration."

      - name: "featured_post"
        label: "Featured Post Card"
        file: "_data/featured_post.yml"
        fields:

          - label: "Enable Featured Post"
            name: "enabled"
            widget: "boolean"
            default: false
            required: false

          - label: "Post URL"
            name: "url"
            widget: "string"
            required: false
            hint: "Enter the URL of the bulletin or article to feature."

          - label: "Featured Card Title"
            name: "card_title"
            widget: "string"
            required: false
            hint: "Enter the small title displayed at the top of the Featured Post card."

          - label: "Thumbnail"
            name: "thumbnail"
            widget: "image"
            required: false
            hint: "Optional. This image appears only in the Featured Post card on the homepage."

          - label: "Label"
            name: "label"
            widget: "markdown"
            required: false

      - name: "about"
        label: "About Page"
        file: "_data/about.yml"
        fields:
          - label: "Eyebrow"
            name: "eyebrow"
            widget: "string"
            required: false

          - label: "Title"
            name: "title"
            widget: "markdown"
            required: false

          - label: "Introduction"
            name: "intro"
            widget: "markdown"
            required: false

          - label: "Quote"
            name: "quote"
            widget: "markdown"
            required: false

          - label: "Club History"
            name: "history"
            widget: "object"
            fields:

              - label: "Section Label"
                name: "section_label"
                widget: "string"
                required: false

              - label: "Section Title"
                name: "section_title"
                widget: "string"
                required: false

              - label: "Section Description"
                name: "section_description"
                widget: "markdown"
                required: false

              - label: "Milestones"
                name: "milestones"
                widget: "list"
                required: false
                allow_add: true
                allow_delete: true
                fields:

                  - label: "Number"
                    name: "number"
                    widget: "string"
                    required: false

                  - label: "Title"
                    name: "title"
                    widget: "string"
                    required: false

                  - label: "Description"
                    name: "description"
                    widget: "markdown"
                    required: false

          - label: "Feature Cards"
            name: "feature_cards"
            widget: "list"
            required: false
            allow_add: true
            allow_delete: true
            hint: "Add or edit the feature cards shown on the About page. Use these for key information about the club, its service, identity, or activities."
            fields:

              - label: "Icon"
                name: "icon"
                widget: "string"
                required: false
                hint: "You can use an emoji, such as 🌏, 🤝, or 📰."

              - label: "Title"
                name: "title"
                widget: "string"
                required: false

              - label: "Description"
                name: "description"
                widget: "markdown"
                required: false

      - name: "services"
        label: "Services Page"
        file: "_data/services.yml"
        fields:
          - label: "Eyebrow"
            name: "eyebrow"
            widget: "string"
            required: false

          - label: "Title"
            name: "title"
            widget: "markdown"
            required: false

          - label: "Introduction"
            name: "intro"
            widget: "markdown"
            required: false

          - label: "Services"
            name: "services"
            widget: "list"
            required: false
            allow_add: true
            allow_remove: true
            fields:
              - label: "Icon"
                name: "icon"
                widget: "string"
                required: false

              - label: "Title"
                name: "title"
                widget: "string"
                required: false

              - label: "Description"
                name: "description"
                widget: "markdown"
                required: false

              - label: "Post URL"
                name: "url"
                widget: "string"
                required: false
                hint: "Optional. Enter the page URL this service card should open."

      - name: "featured_youtube"
        label: "Featured YouTube Video"
        file: "_data/featured_youtube.yml"
        fields:

          - label: "Enable Featured YouTube"
            name: "enabled"
            widget: "boolean"
            default: false
            required: false

          - label: "Card Title"
            name: "title"
            widget: "string"
            default: "Featured Video"
            required: false

          - label: "Video Title"
            name: "video_title"
            widget: "string"
            required: false

          - label: "YouTube URL"
            name: "url"
            widget: "string"
            required: false
            hint: "Paste the full YouTube video URL."

          - label: "Thumbnail"
            name: "thumbnail"
            widget: "image"
            required: false

          - label: "Button Text"
            name: "button_text"
            widget: "string"
            default: "Watch on YouTube →"
            required: false

      - name: "e_bulletins"
        label: "E-Bulletin Files"
        file: "_data/e_bulletins.yml"
        fields:

          - label: "E-Bulletins"
            name: "bulletins"
            widget: "list"
            required: false
            allow_add: true
            allow_delete: true
            fields:

              - label: "Title"
                name: "title"
                widget: "string"

              - label: "Date"
                name: "date"
                widget: "datetime"
                required: false
                date_format: "YYYY-MM-DD"
                time_format: false

              - label: "Type"
                name: "type"
                widget: "select"
                options:
                  - label: "PDF"
                    value: "pdf"
                  - label: "Heyzine Flipbook"
                    value: "flipbook"

              - label: "Thumbnail"
                name: "thumbnail"
                widget: "image"
                required: false
                media_folder: "/assets/e-bulletin-files"
                public_folder: "/assets/e-bulletin-files"
                hint: "Optional. Cover image shown on the E-Bulletin Files page."

              - label: "PDF File"
                name: "pdf"
                widget: "file"
                required: false
                media_folder: "/assets/e-bulletin-files"
                public_folder: "/assets/e-bulletin-files"
                hint: "Upload the PDF file here if this bulletin is a PDF."

              - label: "Heyzine Flipbook URL"
                name: "flipbook_url"
                widget: "string"
                required: false
                hint: "Paste the Heyzine flipbook URL if this bulletin is an interactive flipbook."

              - label: "Description"
                name: "description"
                widget: "text"
                required: false

      - name: "homepage_modal"
        label: "Homepage Modal"
        file: "_data/homepage_modal.yml"
        fields:

          - label: "Enable Modal"
            name: "enabled"
            widget: "boolean"
            default: false
            required: false
            hint: "Turn this on to display the modal on the homepage."

          - label: "Eyebrow"
            name: "eyebrow"
            widget: "string"
            required: false

          - label: "Title"
            name: "title"
            widget: "string"
            required: false

          - label: "Description"
            name: "description"
            widget: "text"
            required: false

          - label: "Image"
            name: "image"
            widget: "image"
            required: false
            hint: "Optional image displayed in the homepage modal."

          - label: "Register Button Text"
            name: "button_text"
            widget: "string"
            required: false
            default: "Register now"

          - label: "Register Button URL"
            name: "button_url"
            widget: "string"
            required: false

          - label: "Open Register Button in New Tab (optional)"
            name: "cta_new_tab"
            widget: "boolean"
            required: false
            default: false
            hint: "When enabled, the Register button opens the Register button in a new browser tab."

          - label: "Learn More URL (optional)"
            name: "learn_more_url"
            widget: "string"
            required: false
            hint: "Enter the URL that should open when visitors click Learn more."

          - label: "Open Learn More in New Tab (optional)"
            name: "learn_more_new_tab"
            widget: "boolean"
            required: false
            default: false
            hint: "When enabled, the Learn more button opens in a new browser tab."

          - label: "Show Once Per Visitor"
            name: "show_once"
            widget: "boolean"
            default: true
            required: false
            hint: "When enabled, the modal will normally appear only once per visitor."

      - name: "members"
        label: "Member Access"
        file: "_data/members.yml"
        fields:

          - label: "Members"
            name: "members"
            widget: "list"
            required: false
            allow_add: true
            allow_delete: true
            label_singular: "Member"
            fields:

              - label: "Member ID"
                name: "id"
                widget: "string"
                hint: "A unique internal ID, such as member-01. Do not use an email address."

              - label: "First Name"
                name: "first_name"
                widget: "string"
                hint: "This is the name shown to the member after login."

              - label: "Google Drive Folders"
                name: "folders"
                widget: "list"
                required: false
                allow_add: true
                allow_delete: true
                label_singular: "Folder"
                fields:

                  - label: "Folder Name"
                    name: "name"
                    widget: "string"
                    hint: "A friendly name for this folder, such as Club Documents or Events."

                  - label: "Google Drive Folder ID"
                    name: "id"
                    widget: "string"
                    hint: "Paste the Google Drive folder ID assigned to this folder."

              - label: "Active"
                name: "active"
                widget: "boolean"
                default: true
                required: false
                hint: "Turn off to temporarily disable this member's Drive access."

  - name: "projects"
    label: "Service Projects"
    label_singular: "Service Project"
    description: "Each entry here becomes a card on the Service Projects page and its own project page at /service-projects/<slug>/. Fill in only what has been verified; empty sections are hidden automatically."
    folder: "_projects/"
    create: true
    delete: true
    slug: "{{fields.slug}}"
    identifier_field: "title"
    summary: "{{title}} — {{rotary_year}} ({{status}})"
    sortable_fields: ["title", "start_date", "rotary_year", "status"]
    view_filters:
      - label: "Ongoing"
        field: "status"
        pattern: "ongoing"
      - label: "Completed"
        field: "status"
        pattern: "completed"
      - label: "Archived"
        field: "status"
        pattern: "archived"

    fields:
      - label: "Layout"
        name: "layout"
        widget: "hidden"
        default: "project"

      # ---------- Basics ----------
      - label: "Project Name"
        name: "title"
        widget: "string"
        hint: "Official project title, e.g. Project BITUIN."

      - label: "Page Address (slug)"
        name: "slug"
        widget: "string"
        pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "Use lowercase letters, numbers and hyphens only, e.g. project-bituin"]
        hint: "Used in the link: /service-projects/<slug>/. Set it once and don't change it afterwards, or old links will break."

      - label: "Acronym"
        name: "acronym"
        widget: "string"
        required: false
        hint: "Optional, e.g. BITUIN."

      - label: "Full Name"
        name: "full_name"
        widget: "string"
        required: false
        hint: "What the acronym stands for, e.g. Building Impact Through Unified Initiatives for Nurturing Families."

      - label: "Icon"
        name: "icon"
        widget: "select"
        default: "star"
        hint: "Line icon shown on the project's card."
        options:
          - { label: "Star", value: "star" }
          - { label: "Heart and handshake", value: "heart-handshake" }
          - { label: "Helping hand", value: "hand-heart" }
          - { label: "Handshake", value: "handshake" }
          - { label: "Baby", value: "baby" }
          - { label: "Smile / dental", value: "smile" }
          - { label: "Water drops", value: "droplets" }
          - { label: "Stethoscope", value: "stethoscope" }
          - { label: "Heartbeat", value: "heart-pulse" }
          - { label: "Open book", value: "book-open" }
          - { label: "Graduation cap", value: "graduation-cap" }
          - { label: "School", value: "school" }
          - { label: "Pen / writing", value: "pen-line" }
          - { label: "Newspaper", value: "newspaper" }
          - { label: "Sprout", value: "sprout" }
          - { label: "Trees", value: "trees" }
          - { label: "Leaf", value: "leaf" }
          - { label: "People", value: "users" }
          - { label: "Globe", value: "globe" }
          - { label: "Shop / livelihood", value: "store" }
          - { label: "Growth", value: "trending-up" }
          - { label: "House", value: "house" }
          - { label: "Meals", value: "utensils" }
          - { label: "Clothing", value: "shirt" }
          - { label: "Church / interfaith", value: "church" }
          - { label: "Scales / justice", value: "scale" }
          - { label: "Shield", value: "shield-check" }
          - { label: "Light bulb", value: "lightbulb" }
          - { label: "Sun", value: "sun" }
          - { label: "Target", value: "target" }

      - label: "Short Description"
        name: "description"
        widget: "text"
        hint: "One or two sentences for the project card and search results (about 30 words)."

      - label: "Cover Image"
        name: "cover_image"
        widget: "image"
        required: false
        hint: "Wide (landscape) photo from the project, shown at the top of the project page."

      - label: "Cover Image Alt Text"
        name: "cover_alt"
        widget: "string"
        required: false
        hint: "Describe what the photo shows, for visitors who can't see it."

      - label: "Location"
        name: "location"
        widget: "string"
        hint: "Where the project is carried out, e.g. Longos Pampano Child Development Center, Barangay Longos."

      - label: "City / Municipality"
        name: "city"
        widget: "string"
        hint: "Used by the Location filter. Spell it the same way every time, e.g. Malabon City."

      - label: "Rotary Year"
        name: "rotary_year"
        widget: "select"
        default: "2026–2027"
        options: ["2030–2031", "2029–2030", "2028–2029", "2027–2028", "2026–2027", "2025–2026", "2024–2025", "2023–2024", "2022–2023", "2021–2022", "2020–2021", "2019–2020", "2018–2019", "2017–2018", "2016–2017", "2015–2016"]

      - label: "Start Date"
        name: "start_date"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
        picker_utc: true
        hint: "When the project started or its first activity took place. Used to sort projects, newest first."

      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - { label: "Flagship / Continuing Program", value: "flagship" }
          - { label: "Individual Service Project", value: "individual" }
          - { label: "Community Activity", value: "community" }

      - label: "Status"
        name: "status"
        widget: "select"
        default: "ongoing"
        options:
          - { label: "Ongoing", value: "ongoing" }
          - { label: "Completed", value: "completed" }
          - { label: "Archived", value: "archived" }

      - label: "Rotary Areas of Focus"
        name: "areas_of_focus"
        widget: "select"
        multiple: true
        required: false
        hint: "Choose only the areas this project actually works on."
        options:
          - "Peacebuilding and Conflict Prevention"
          - "Disease Prevention and Treatment"
          - "Water, Sanitation, and Hygiene"
          - "Maternal and Child Health"
          - "Basic Education and Literacy"
          - "Community Economic Development"
          - "Supporting the Environment"

      # ---------- About ----------
      - label: "Project Overview"
        name: "body"
        widget: "markdown"
        required: false
        hint: "Opening paragraphs on the project page."

      - label: "Background"
        name: "background"
        widget: "markdown"
        required: false

      - label: "Community Needs Addressed"
        name: "community_needs"
        widget: "markdown"
        required: false

      - label: "Project Rationale"
        name: "rationale"
        widget: "markdown"
        required: false

      - label: "Objectives"
        name: "objectives"
        widget: "list"
        required: false
        field: { label: "Objective", name: "objective", widget: "string" }

      - label: "Target Beneficiaries"
        name: "target_beneficiaries"
        widget: "text"
        required: false

      # ---------- Partners ----------
      - label: "Partners (from the Partners list)"
        name: "partners"
        widget: "relation"
        collection: "partners"
        value_field: "partner_name"
        search_fields: ["partner_name"]
        display_fields: ["partner_name"]
        multiple: true
        required: false
        hint: "Pick partners already saved under Partners. Their logo and description are reused automatically."

      - label: "Other Partners"
        name: "other_partners"
        widget: "list"
        required: false
        hint: "Partners that aren't in the Partners list (offices, foundations, other clubs)."
        summary: "{{fields.name}}"
        fields:
          - { label: "Organization Name", name: "name", widget: "string" }
          - { label: "Logo", name: "logo", widget: "image", required: false, hint: "Only if the organization allows its logo to be used." }
          - { label: "Short Description", name: "description", widget: "text", required: false }
          - { label: "Website or Social Media Link", name: "url", widget: "string", required: false }

      # ---------- Implementation ----------
      - label: "Implementation Phases & Activities"
        name: "activities"
        widget: "list"
        required: false
        summary: "{{fields.date}} — {{fields.title}}"
        hint: "Add one entry per activity or phase. Continuing programs can have many."
        fields:
          - { label: "Activity Title", name: "title", widget: "string" }
          - { label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", picker_utc: true, required: false }
          - { label: "Location", name: "location", widget: "string", required: false }
          - { label: "Description", name: "description", widget: "markdown", required: false }
          - { label: "Number of Beneficiaries", name: "beneficiaries", widget: "string", required: false, hint: "Verified figure with what it counts, e.g. 148 PDLs." }
          - label: "Significant Accomplishments"
            name: "accomplishments"
            widget: "list"
            required: false
            field: { label: "Accomplishment", name: "item", widget: "string" }
          - label: "Photos"
            name: "photos"
            widget: "list"
            required: false
            fields:
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Caption", name: "caption", widget: "string", required: false }

      # ---------- Impact ----------
      - label: "Impact at a Glance"
        name: "impact_metrics"
        widget: "list"
        required: false
        summary: "{{fields.value}} {{fields.label}}"
        hint: "Verified figures only. Choose the metrics that fit this project."
        fields:
          - { label: "Value", name: "value", widget: "string", hint: "e.g. 130" }
          - { label: "Label", name: "label", widget: "string", hint: "e.g. Daycare learners served" }
          - { label: "Note / Source", name: "note", widget: "string", required: false, hint: "Optional, e.g. First phase, August 2026." }

      # ---------- Gallery ----------
      - label: "Photo Gallery"
        name: "gallery"
        widget: "list"
        required: false
        summary: "{{fields.caption}}"
        hint: "Shows 12 photos at a time (4 per row on desktop). With more than 12, visitors use the arrows to see the next 12. Resize photos to about 1600 pixels wide before uploading."
        fields:
          - { label: "Image", name: "image", widget: "image" }
          - { label: "Caption", name: "caption", widget: "string", required: false }
          - { label: "Photo Credit", name: "credit", widget: "string", required: false }

      # ---------- Timeline ----------
      - label: "Timeline & Milestones"
        name: "timeline"
        widget: "list"
        required: false
        summary: "{{fields.date}} — {{fields.title}}"
        fields:
          - { label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", picker_utc: true }
          - { label: "Milestone", name: "title", widget: "string" }
          - label: "Type"
            name: "type"
            widget: "select"
            default: "milestone"
            options:
              - { label: "Project launch", value: "launch" }
              - { label: "Partnership agreement / meeting", value: "partnership" }
              - { label: "Implementation", value: "implementation" }
              - { label: "Milestone", value: "milestone" }
              - { label: "New phase", value: "phase" }
              - { label: "Completed / continuing", value: "status" }
          - { label: "Description", name: "description", widget: "text", required: false }

      # ---------- Testimonials ----------
      - label: "Voices of Impact (Testimonials)"
        name: "testimonials"
        widget: "list"
        required: false
        summary: "{{fields.name}}"
        hint: "A testimonial only appears on the site when 'Permission confirmed' is ticked."
        fields:
          - { label: "Statement", name: "quote", widget: "text" }
          - { label: "Translation (optional)", name: "translation", widget: "text", required: false }
          - { label: "Name", name: "name", widget: "string", required: false, hint: "Leave blank to show it without a name." }
          - label: "Speaker Type"
            name: "speaker_type"
            widget: "select"
            required: false
            options: ["Beneficiary", "Community Leader", "Partner Organization", "Volunteer", "Rotarian"]
          - { label: "Role", name: "role", widget: "string", required: false }
          - { label: "Organization", name: "organization", widget: "string", required: false }
          - { label: "Photo", name: "photo", widget: "image", required: false }
          - { label: "Permission confirmed", name: "permission", widget: "boolean", default: false, hint: "Tick only when the person agreed to be quoted (and pictured, if a photo is added)." }

      # ---------- SEO ----------
      - label: "SEO & Sharing"
        name: "seo"
        widget: "object"
        required: false
        collapsed: true
        hint: "Optional. If left blank, the project name, short description and cover image are used."
        fields:
          - { label: "Page Title", name: "title", widget: "string", required: false }
          - { label: "Meta Description", name: "description", widget: "text", required: false, hint: "About 150 characters." }
          - { label: "Sharing Image", name: "image", widget: "image", required: false }

  - name: "partners"
    label: "Partners"
    folder: "_partners/"
    create: true
    delete: true
    slug: "{{slug}}"
    fields:

      - label: "Layout"
        name: "layout"
        widget: "hidden"
        default: "partner"

      - label: "Partner Name"
        name: "partner_name"
        widget: "string"

      - label: "Display Order"
        name: "order"
        widget: "number"
        value_type: "int"
        required: false      
        default: 1
        min: 1
        step: 1
        hint: "Optional. Lower numbers appear first. Using 10, 20, 30, 40... makes it easier to insert partners between existing partners."

      - label: "Logo"
        name: "logo"
        widget: "image"
        required: false
        media_folder: "/assets/images/partners"
        public_folder: "/assets/images/partners"

      - label: "Website"
        name: "website"
        widget: "string"
        required: false

      - label: "Roles"
        name: "roles"
        widget: "list"
        label_singular: "Role"
        default:
          - "Partner"
        field:
          label: "Role"
          name: "role"
          widget: "string"

      - label: "Description"
        name: "description"
        widget: "text"
        required: false

      - label: "Show on Homepage"
        name: "homepage"
        widget: "boolean"
        default: false  