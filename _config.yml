title: My Jekyll Site
description: A clean, standard static site built with Jekyll and Minima.
baseurl: ""
url: ""

# Standard Jekyll Theme Mapping
theme: minima

plugins:
  - jekyll-feed
  - jekyll-seo-tag

collections:
  bulletins:
    output: true

  partners:
    output: true
    permalink: /partners/:name/

  projects:
    output: true
    permalink: /service-projects/:name/

defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"